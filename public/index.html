<!doctype html>
<html lang="en-IE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>M6 Motors Prep</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bump ?v= after changing these files so phones load the new version -->
  <link rel="stylesheet" href="styles.css?v=81">
  <script type="module" src="app.js?v=81"></script>
</head>
<body>
  <!-- Shown until config.js is filled in -->
  <section id="setupScreen" class="center-screen" hidden>
    <div class="auth-card">
      <div class="logo logo-lg"><img src="logo.png" alt="M6 Motors" onerror="this.remove()"><span>M6</span></div>
      <h1>Almost there</h1>
      <p>Fill in <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> in <code>config.js</code>, then reload.</p>
    </div>
  </section>

  <section id="loginScreen" class="center-screen" hidden>
    <form id="loginForm" class="auth-card">
      <div class="logo logo-lg"><img src="logo.png" alt="M6 Motors" onerror="this.remove()"><span>M6</span></div>
      <h1>M6 Motors</h1>
      <p class="muted">Vehicle prep — staff sign in</p>
      <label>Name<input name="login" type="text" autocomplete="username" autocapitalize="words" autocorrect="off" spellcheck="false" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <label class="check"><input type="checkbox" name="remember" checked> Keep me signed in</label>
      <button class="btn primary block" type="submit">Sign in</button>
      <p class="muted small-print">Forgot your password? Ask the manager to reset it.</p>
      <p class="form-error" id="loginError" hidden></p>
    </form>
  </section>

  <div id="appScreen" hidden>
    <header class="topbar">
      <button id="backBtn" class="icon-btn" type="button" aria-label="Back" hidden></button>
      <div class="logo"><img src="logo.png" alt="M6 Motors" onerror="this.remove()"><span>M6</span></div>
      <div class="brand">
        <strong>M6 Motors</strong>
        <span id="viewTitle">Vehicle prep</span>
      </div>
      <div id="clock" class="clock" aria-live="off"><strong></strong><span></span></div>
      <button id="trainingBtn" class="icon-btn" type="button" aria-label="Training videos" title="Training videos"></button>
      <button id="suppliesBtn" class="icon-btn badge-host" type="button" aria-label="Supplies" title="Supplies — ask for materials"><span id="suppliesBadge" class="icon-badge" hidden></span></button>
      <button id="teamBtn" class="icon-btn admin-only" type="button" aria-label="Team" title="Team"></button>
      <button id="reportBtn" class="icon-btn admin-only" type="button" aria-label="Pay report" title="Pay report"></button>
      <button id="meBtn" class="avatar" type="button" aria-label="Account" title="Account"></button>
    </header>

    <main id="mainView">
      <nav class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="sold" title="Sold cars, by delivery day">Deliveries <span class="count"></span><span class="count today" hidden></span></button>
        <button type="button" role="tab" data-tab="viewing" title="Cars booked for a viewing">Viewings <span class="count"></span></button>
        <button type="button" role="tab" data-tab="stock">Stock <span class="count"></span></button>
        <button type="button" role="tab" data-tab="in_prep" title="Cars someone is working on now">In prep <span class="count"></span></button>
        <button type="button" role="tab" data-tab="bodyshop" title="Cars out for panel beating &amp; paint">Bodyshop <span class="count"></span></button>
        <button type="button" role="tab" data-tab="dent">Dent <span class="count"></span></button>
        <button type="button" role="tab" data-tab="loan" title="Cars on loan to customers">Loan <span class="count"></span></button>
        <button type="button" role="tab" data-tab="delivered">Delivered <span class="count"></span></button>
      </nav>
      <div id="pushBanner" class="push-banner" hidden></div>
      <button id="myCount" class="my-count" type="button" hidden></button>
      <div class="toolbar">
        <div class="search-box">
          <input id="search" type="search" placeholder="Search plate, make, model, salesperson" autocomplete="off">
          <button id="searchClear" class="search-clear" type="button" aria-label="Clear search" title="Clear search" hidden></button>
        </div>
        <button id="printBtn" type="button" class="btn small" hidden>🖨 Print list</button>
        <button id="purgeBtn" type="button" class="btn ghost danger small admin-only" hidden>Delete records older than 30 days</button>
      </div>
      <div class="list-viewport"><div id="listTrack" class="list-track">
        <div id="list" class="list"><p class="empty">Loading…</p></div>
      </div></div>
      <div class="fab-row">
        <button id="photosFab" class="fab secondary" type="button" hidden></button>
        <button id="fab" class="fab" type="button"></button>
      </div>
    </main>

    <section id="teamView" class="page" hidden></section>
    <section id="reportView" class="page" hidden></section>
    <section id="suppliesView" class="page" hidden></section>
    <button id="helpBtn" class="help-fab" type="button" aria-label="Help" title="How to use the app"></button>
  </div>

  <!-- Filled just before printing the daily sold-cars sheet -->
  <div id="printSheet" class="print-sheet"></div>

  <div id="sheetBackdrop" class="sheet-backdrop" hidden>
    <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
